--gold:#FFD966;--blue:#9DC3E6;--green:#A9D08E;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding:0 0 40px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.hdr{text-align:center;padding:18px 0 8px}
.hdr .brand{font-size:12px;letter-spacing:.18em;color:var(--mut);font-weight:700}
.hdr h1{margin:4px 0 2px;font-size:30px;font-weight:800}
.hdr .sub{font-size:12px;color:var(--mut)}
.execs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.execs .lbl{font-size:12px;color:var(--mut);align-self:center;margin-right:2px}
.pill{font-size:13px;font-weight:700;color:#0f172a;border-radius:999px;padding:3px 12px}
.note{text-align:center;font-size:12px;color:var(--mut);margin:10px 0 2px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:#172033;border-bottom:1px solid var(--line)}
.day .dow{font-weight:800;font-size:14px;letter-spacing:.06em}
.day .dt{font-size:13px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-top:1px solid #263349}
.row:first-child{border-top:none}
.row .nm{font-weight:600}
.row .tm{font-variant-numeric:tabular-nums;color:var(--txt)}
.row.out .nm{color:var(--mut)}
.row.out .tm{color:var(--mut);font-weight:600}
.row.open .nm,.row.open .tm{color:var(--open);font-weight:700}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.ft{text-align:center;font-size:12px;color:var(--mut);margin-top:18px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style>

<script>
(function(){
  var S = JSON.parse(document.getElementById('state').textContent);
  var EXEC_COLORS = {"Corey":"#FFD966","Chase":"#9DC3E6","Mike":"#A9D08E"};
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function pad(n){return (n<10?"0":"")+n;}
  function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function fmtT(h){
    if(h==null) return "";
    var hr=Math.floor(h), mn=Math.round((h-hr)*60);
    var ap=hr>=12?"p":"a"; var h12=hr%12; if(h12===0)h12=12;
    return h12+(mn?(":"+pad(mn)):"")+ap;
  }
  function fmtUpd(iso){
    try{var d=new Date(iso);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+", "+
      d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}catch(e){return iso;}
  }
  var today = todayISO();
  var dates = Object.keys(S.shifts_by_date).filter(function(d){return d>=today;}).sort();
  // exec coverage present in the upcoming window
  var execSet=[];
  dates.forEach(function(d){S.shifts_by_date[d].forEach(function(s){
    if(EXEC_COLORS[s.name] && s.kind==="shift" && execSet.indexOf(s.name)<0) execSet.push(s.name);
  });});
  var app=document.getElementById('app');
  var html="";
  html+='<div class="hdr"><div class="brand">THE UPS STORE</div>'+
        '<h1>'+S.store_name+'</h1>'+
        '<div class="sub">#'+S.store_id+' · updated '+fmtUpd(S.last_updated)+'</div></div>';
  if(execSet.length){
    html+='<div class="execs"><span class="lbl">Exec coverage:</span>';
    execSet.forEach(function(n){html+='<span class="pill" style="background:'+EXEC_COLORS[n]+'">'+n+'</span>';});
    html+='</div>';
  }
  html+='<div class="note">'+dates.length+' day(s) loaded · new month posts mid-month</div>';
  if(!dates.length){ html+='<div class="empty">No upcoming days loaded yet.</div>'; }
  dates.forEach(function(d){
    var parts=d.split("-"); var dd=new Date(+parts[0],+parts[1]-1,+parts[2]);
    var rows=S.shifts_by_date[d];
    html+='<div class="day"><div class="dh"><span class="dow">'+DOW[dd.getDay()].toUpperCase()+'</span>'+
          '<span class="dt">'+(+parts[1])+'/'+(+parts[2])+'</span></div>';
    if(!rows.length){ html+='<div class="row"><span class="nm" style="color:var(--mut)">Closed / no shifts</span></div>'; }
    rows.forEach(function(s){
      var cls="row", tm="";
      if(s.kind==="OUT"){cls+=" out"; tm="OFF";}
      else if(s.kind==="OPEN"){cls+=" open"; tm=fmtT(s.start)+" - "+fmtT(s.end);}
      else{tm=fmtT(s.start)+" - "+fmtT(s.end);}
      var chip = EXEC_COLORS[s.name] ? '<span class="chip" style="background:'+EXEC_COLORS[s.name]+'"></span>' : '';
      html+='<div class="'+cls+'"><span class="nm">'+chip+s.name+'</span><span class="tm">'+tm+'</span></div>';
    });
    html+='</div>';
  });
  html+='<div class="ft">Past days drop off automatically · FC Franchise</div>';
  app.innerHTML=html;
})();
</script>
