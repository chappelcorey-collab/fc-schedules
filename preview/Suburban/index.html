<!DOCTYPE html><html lang="en"><head>

<title>Suburban Schedule &middot; FC Franchise</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body { background: #f7f7f8; color: #1a1a1a; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: env(safe-area-inset-bottom, 0); }
.fc-header { background: linear-gradient(135deg, #009CBD, #007a96); color: white; padding: 14px 16px 12px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.fc-logo { background: white; color: #009CBD; font-weight: 800; padding: 3px 7px; border-radius: 4px; font-size: 10px; letter-spacing: .1em; display: inline-block; }
.fc-store { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -.3px; }
.fc-meta { font-size: 11px; opacity: .88; margin-top: 2px; }
.fc-search { background: white; padding: 10px 16px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 78px; z-index: 9; }
.fc-search input { width: 100%; padding: 10px 14px; font-size: 16px; border: 1.5px solid #e0e0e0; border-radius: 10px; outline: none; background: #f7f7f8; transition: border-color .15s; }
.fc-search input:focus { border-color: #009CBD; background: white; }
.fc-banner { background: #fff3cd; color: #856404; padding: 10px 16px; font-size: 13px; text-align: center; }
.fc-days { padding: 12px; max-width: 640px; margin: 0 auto; }
.fc-day { background: white; border-radius: 12px; margin-bottom: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-left: 4px solid #009CBD; }
.fc-day.weekend { border-left-color: #FFB500; background: #fdfcfa; }
.fc-day.today { border-left-color: #009CBD; box-shadow: 0 2px 8px rgba(0,156,189,.25); }
.fc-day-header { padding: 10px 14px 8px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fc-day.today .fc-day-header { background: linear-gradient(135deg,#009CBD,#007a96); color: white; padding: 12px 14px; }
.fc-day.today .fc-day-header::after { content: "TODAY"; font-size: 10px; font-weight: 800; letter-spacing: .8px; background: white; color: #007a96; padding: 2px 6px; border-radius: 4px; }
.fc-dow { color: #007a96; text-transform: uppercase; font-size: 12px; font-weight: 800; }
.fc-day.today .fc-dow { color: white; }
.fc-date { color: #64748b; font-size: 13px; font-weight: 600; margin-left: 6px; }
.fc-day.today .fc-date { color: rgba(255,255,255,.92); }
.fc-shifts { padding: 6px 0 8px; }
.fc-shift { padding: 5px 14px; font-family: ui-monospace, "SF Mono", Consolas, Menlo, monospace; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.fc-shift-name { font-weight: 700; }
.fc-shift-time { color: #007a96; font-weight: 600; }
.fc-shift.open { background: #FFE5E5; color: #C00000; }
.fc-shift.open .fc-shift-name, .fc-shift.open .fc-shift-time { color: #C00000; font-weight: 800; }
.fc-shift.exec-chase { background: #FFB500; color: #1a1a1a; }
.fc-shift.exec-chase .fc-shift-name, .fc-shift.exec-chase .fc-shift-time { color: #1a1a1a; font-weight: 800; }
.fc-shift.exec-corey { background: #B3E5F2; color: #003040; }
.fc-shift.exec-corey .fc-shift-name, .fc-shift.exec-corey .fc-shift-time { color: #003040; font-weight: 800; }
.fc-shift.exec-mike { background: #006580; color: white; }
.fc-shift.exec-mike .fc-shift-name, .fc-shift.exec-mike .fc-shift-time { color: white; font-weight: 800; }
.fc-exec-legend { padding: 8px 16px; background: white; border-bottom: 1px solid #e0e0e0; font-size: 11px; color: #64748b; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.fc-exec-legend strong { color: #1a1a1a; }
.fc-exec-chip { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }
.fc-exec-chip.chase { background: #FFB500; color: #1a1a1a; }
.fc-exec-chip.corey { background: #B3E5F2; color: #003040; }
.fc-exec-chip.mike { background: #006580; color: white; }
.fc-out { padding: 6px 14px 8px; font-size: 11px; color: #b91c1c; font-weight: 700; border-top: 1px dashed #fecaca; margin-top: 4px; }
.fc-out::before { content: "OUT: "; color: #94a3b8; font-weight: 600; }
.fc-empty { padding: 50px 24px; text-align: center; color: #64748b; font-size: 14px; }
.fc-empty-icon { font-size: 32px; margin-bottom: 8px; opacity: .4; }
.fc-footer { padding: 18px 16px 24px; text-align: center; color: #94a3b8; font-size: 11px; }
.fc-footer strong { color: #009CBD; font-weight: 700; }
.fc-req { display: block; max-width: 616px; margin: 10px auto 0; background: white; border: 1.5px solid #009CBD; color: #007a96; font-weight: 700; font-size: 15px; padding: 12px 14px; border-radius: 12px; text-decoration: none; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.fc-req small { display: block; font-weight: 500; font-size: 12px; color: #64748b; margin-top: 2px; }
@media (max-width: 380px) { .fc-store { font-size: 20px; } .fc-day-header { font-size: 14px; } .fc-shift { font-size: 13.5px; padding: 4px 12px; } }

.fcv-tabs{display:flex;gap:4px;background:#e9eef3;border-radius:10px;padding:3px}
.fcv-tabs button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-weight:800;font-size:13px;color:#475569;cursor:pointer}
.fcv-tabs button.on{background:#fff;color:#007a96;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fcv-navbar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px;font-weight:800;font-size:15px}
.fcv-nb{border:1.5px solid #e2e8f0;background:#fff;border-radius:9px;width:42px;height:36px;font-size:22px;line-height:1;color:#007a96;cursor:pointer}
.fcv-nb:disabled{opacity:.3}
.fcv-wk{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);-webkit-overflow-scrolling:touch}
.fcv-wk table{border-collapse:collapse;width:100%;min-width:540px;font-size:12px}
.fcv-wk th,.fcv-wk td{border-bottom:1px solid #eef2f6;padding:4px 2px;text-align:center;vertical-align:top}
.fcv-wk thead th{font-weight:600;color:#64748b;font-size:11px;background:#fff;line-height:1.2}
.fcv-wk thead th b{font-size:14px;color:#1a1a1a}
.fcv-wk thead th.t,.fcv-wk thead th.t b{color:#009CBD}
.fcv-wk tbody th{text-align:left;font-weight:700;white-space:nowrap;position:sticky;left:0;background:#fff;padding:6px 6px 6px 10px;font-size:12.5px;z-index:1}
.fcv-wk td.t{background:#f3fbfd}
.fcv-b{display:block;width:100%;border:0;border-radius:6px;background:#e6f6fa;color:#005a70;font:700 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:4px 1px;margin:1px 0;cursor:default}
.fcv-b.pickable{cursor:pointer}
.fcv-b.open{background:#FFE5E5;color:#C00000}
.fcv-b.x-chase{background:#FFB500;color:#1a1a1a}
.fcv-b.x-corey{background:#B3E5F2;color:#003040}
.fcv-b.x-mike{background:#006580;color:#fff}
.fcv-b.sel{background:#009CBD;color:#fff;box-shadow:0 0 0 2px #00546a inset}
.fcv-none{color:#94a3b8;font-style:italic;padding:18px!important}
.fcv-mo{background:#fff;border-radius:12px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.fcv-dow,.fcv-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.fcv-dow span{text-align:center;font-size:11px;font-weight:700;color:#94a3b8;padding-bottom:3px}
.fcv-c{min-height:56px;border:1px solid #eef2f6;border-radius:8px;background:#fff;padding:3px 3px 4px;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer}
.fcv-c[disabled]{cursor:default}
.fcv-c .n{font-size:12px;font-weight:700;color:#334155}
.fcv-c small{display:block;font-size:10px;line-height:1.15;color:#007a96;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcv-c small.o{color:#C00000}
.fcv-c.t{border-color:#009CBD;box-shadow:0 0 0 1px #009CBD inset}
.fcv-c.pad{border:0;background:none;cursor:default}
.fcv-c.dim{opacity:.38}
.fcv-c.has{background:#f0fafc}
.fcv-c.sel{background:#009CBD;border-color:#009CBD}
.fcv-c.sel .n,.fcv-c.sel small{color:#fff}
</style>
</head>
<body>
<div id="cowork-updated-stamp" style="position:fixed;top:8px;right:10px;z-index:99999;background:rgba(0,111,136,.95);color:#fff;font:600 11px/1.1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:5px 9px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:none;letter-spacing:.01em;">Updated: —</div>
<div class="fc-header">
  <span class="fc-logo">THE UPS STORE</span>
  <div class="fc-store">Suburban</div>
  <div class="fc-meta">#2335 &middot; updated <span id="updated">—</span></div>
</div>
<div class="fc-search"><input type="search" id="search" placeholder="Filter by name..." autocomplete="off"></div>
<div style="padding:0 12px"><a class="fc-req" href="../requests/?store=Suburban">Availability, time off &amp; shift swaps &rarr;<small>Keep your availability up to date - it&#39;s what the schedule is built from</small></a></div>
<div class="fc-exec-legend"><strong>Exec coverage:</strong><span class="fc-exec-chip chase">Chase</span><span class="fc-exec-chip corey">Corey</span><span class="fc-exec-chip mike">Mike</span></div>
<div id="banner"></div>
<div class="fc-days" style="padding-bottom:0"><div class="fcv-tabs" id="fcvTabs"><button type="button" data-v="day">Day</button><button type="button" data-v="week">Week</button><button type="button" data-v="month">Month</button></div></div>
<div id="fcvAlt" class="fc-days" style="display:none;padding-top:0"><div id="fcvNav" class="fcv-navbar"></div><div id="fcvBody"></div><p style="font-size:11px;color:#94a3b8;text-align:center;margin:10px 0 0" id="fcvHint"></p></div>

<div id="days" class="fc-days"></div>
<div class="fc-footer">Past days drop off automatically &middot; <strong>FC Franchise</strong></div>
<script>
const STATIC_STATE = {"store_id":"2335","store_name":"Suburban","store_hours":{"0":[8,19],"1":[8,19],"2":[8,19],"3":[8,19],"4":[8,19],"5":[9,17],"6":[10,15]},"shifts_by_date":{"2026-11-25":[{"name":"Adam","kind":"shift","start":8.0,"end":14.0},{"name":"Omar","kind":"shift","start":8.0,"end":12.0},{"name":"Corey","kind":"shift","start":10.0,"end":18.0},{"name":"Colin","kind":"shift","start":12.0,"end":15.0},{"name":"RJ","kind":"shift","start":14.0,"end":18.0},{"name":"AnthonyM","kind":"shift","start":15.0,"end":19.0},{"name":"Danny","kind":"shift","start":16.5,"end":19.0}],"2026-11-27":[{"name":"Colin","kind":"shift","start":8.0,"end":10.0},{"name":"Omar","kind":"shift","start":8.0,"end":11.0},{"name":"Corey","kind":"shift","start":10.0,"end":18.0},{"name":"Adam","kind":"shift","start":12.0,"end":19.0},{"name":"Jayson","kind":"shift","start":13.5,"end":19.0}],"2026-11-28":[{"name":"Dyllan","kind":"shift","start":9.0,"end":17.0},{"name":"Jayson","kind":"shift","start":9.0,"end":17.0},{"name":"Omar","kind":"shift","start":12.0,"end":17.0}],"2026-11-29":[{"name":"Adam","kind":"shift","start":10.0,"end":15.0},{"name":"Dyllan","kind":"shift","start":10.0,"end":15.0}],"2026-11-30":[{"name":"Colin","kind":"shift","start":8.0,"end":12.0},{"name":"Omar","kind":"shift","start":8.0,"end":12.0},{"name":"Corey","kind":"shift","start":10.0,"end":18.0},{"name":"Chase","kind":"shift","start":12.0,"end":15.5},{"name":"AnthonyM","kind":"shift","start":14.0,"end":19.0},{"name":"Lucy","kind":"shift","start":14.0,"end":18.0},{"name":"Adam","kind":"shift","start":15.0,"end":19.0},{"name":"OPEN","kind":"shift","start":16.0,"end":19.0}]},"last_updated":"2026-11-25T19:39:42.081630Z","audit_verdict":"PASS","audit_fixes_applied":0};
const STORE_ID = "2335";
const SEARCH_KEY = "fc_staff_search_" + STORE_ID;
function fmtTime(h) {
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  const ampm = hh >= 12 ? "p" : "a";
  const h12 = (hh % 12 === 0) ? 12 : hh % 12;
  return mm ? `${h12}:${String(mm).padStart(2,"0")}${ampm}` : `${h12}${ampm}`;
}
function todayIso() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function render() {
  const today = todayIso();
  const search = (document.getElementById("search").value || "").toLowerCase().trim();
  if (search) localStorage.setItem(SEARCH_KEY, search); else localStorage.removeItem(SEARCH_KEY);
  try { document.getElementById("updated").textContent = new Date(STATIC_STATE.last_updated).toLocaleString(undefined, { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }); }
  catch { document.getElementById("updated").textContent = STATIC_STATE.last_updated; }
  const dates = Object.keys(STATIC_STATE.shifts_by_date).filter(d => d >= today).sort();
  const days = document.getElementById("days");
  const banner = document.getElementById("banner");
  banner.innerHTML = "";
  if (dates.length === 0) { days.innerHTML = '<div class="fc-empty"><div class="fc-empty-icon">📅</div>No upcoming schedule loaded.<br>Check back after the next build.</div>'; return; }
  const lastDate = dates[dates.length - 1];
  const daysAhead = Math.floor((new Date(lastDate + "T12:00:00") - new Date(today + "T12:00:00")) / 86400000);
  if (daysAhead < 7) { banner.innerHTML = '<div class="fc-banner">Only ' + (daysAhead + 1) + ' day(s) of schedule loaded. Next month builds the 14th–21st.</div>'; }
  let html = "", renderedAny = false;
  for (const dateStr of dates) {
    const d = new Date(dateStr + "T12:00:00");
    const allShifts = STATIC_STATE.shifts_by_date[dateStr] || [];
    let shifts = allShifts.filter(s => s.kind !== "OUT");
    let outs = allShifts.filter(s => s.kind === "OUT");
    if (search) {
      shifts = shifts.filter(s => (s.name || "").toLowerCase().includes(search));
      outs = outs.filter(s => (s.name || "").toLowerCase().includes(search));
      if (shifts.length === 0 && outs.length === 0) continue;
    }
    renderedAny = true;
    const isToday = dateStr === today;
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const dow = d.toLocaleDateString(undefined, { weekday: "short" });
    const monthDay = d.toLocaleDateString(undefined, { month: "numeric", day: "numeric" });
    const cls = "fc-day" + (isToday ? " today" : "") + (isWeekend ? " weekend" : "");
    html += '<div class="' + cls + '" data-d="' + dateStr + '"><div class="fc-day-header"><span><span class="fc-dow">' + dow + '</span><span class="fc-date">' + monthDay + '</span></span></div><div class="fc-shifts">';
    if (shifts.length === 0 && outs.length === 0) { html += '<div class="fc-shift" style="color:#94a3b8;font-style:italic;justify-content:center;">closed / no shifts</div>'; }
    for (const s of shifts) {
      const upper = (s.name || "").toUpperCase();
      const isOpen = upper === "OPEN";
      let execCls = "";
      if (upper === "CHASE") execCls = " exec-chase";
      else if (upper === "COREY") execCls = " exec-corey";
      else if (upper === "MIKE" || upper === "MICHAEL") execCls = " exec-mike";
      html += '<div class="fc-shift' + (isOpen ? " open" : execCls) + '"><span class="fc-shift-name">' + s.name + '</span><span class="fc-shift-time">' + fmtTime(s.start) + " - " + fmtTime(s.end) + '</span></div>';
    }
    html += "</div>";
    if (outs.length > 0) { html += '<div class="fc-out">' + outs.map(s => s.name).join(", ") + "</div>"; }
    html += "</div>";
  }
  if (!renderedAny && search) { days.innerHTML = '<div class="fc-empty"><div class="fc-empty-icon">🔎</div>No shifts found for "' + search + '".</div>'; }
  else { days.innerHTML = html; }
  if (!search) {
    const todayEl = document.querySelector(".fc-day.today");
    if (todayEl) setTimeout(() => todayEl.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
  }
}

const FCV=(()=>{
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const monday=s=>add(s,-((parse(s).getDay()+6)%7));
const addMonth=(ym,k)=>{const[y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const ft=h=>{h=+h;const hh=Math.floor(h),mm=Math.round((h-hh)*60);return(hh%12||12)+(mm?":"+pad(mm):"")+(hh<12?"a":"p")};
const kind=n=>{const u=(n||"").toUpperCase();return u==="OPEN"?"open":u==="CHASE"?"x-chase":u==="COREY"?"x-corey":(u==="MIKE"||u==="MICHAEL")?"x-mike":""};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dl=(s,o)=>parse(s).toLocaleDateString(undefined,o);
function week(el,data,o){
  const days=[...Array(7)].map((_,i)=>add(o.start,i)),t=today(),rows={},first={};
  days.forEach((ds,i)=>(data[ds]||[]).forEach(s=>{if(s.kind==="OUT"||(o.filter&&!o.filter(s,ds)))return;
    (rows[s.name]=rows[s.name]||[[],[],[],[],[],[],[]])[i].push(s);first[s.name]=Math.min(first[s.name]??99,i*100+s.start)}));
  const names=Object.keys(rows).sort((a,b)=>(a.toUpperCase()==="OPEN")-(b.toUpperCase()==="OPEN")||first[a]-first[b]||a.localeCompare(b));
  let h='<div class="fcv-wk"><table><thead><tr><th></th>'+days.map(ds=>'<th class="'+(ds===t?"t":"")+'">'+dl(ds,{weekday:"short"})+'<br><b>'+parse(ds).getDate()+'</b></th>').join("")+'</tr></thead><tbody>';
  names.forEach(n=>{h+='<tr><th>'+esc(n)+'</th>';rows[n].forEach((ss,i)=>{h+='<td class="'+(days[i]===t?"t":"")+'">'+ss.map(s=>'<button type="button" class="fcv-b '+kind(n)+(o.pick?" pickable":"")+(o.sel&&o.sel(days[i],s)?" sel":"")+'" data-d="'+days[i]+'" data-s="'+s.start+'" data-e="'+s.end+'" data-n="'+esc(n)+'">'+ft(s.start)+'<br>'+ft(s.end)+'</button>').join("")+'</td>'});h+='</tr>'});
  if(!names.length)h+='<tr><td colspan="8" class="fcv-none">'+(o.empty||"No shifts this week")+'</td></tr>';
  el.innerHTML=h+'</tbody></table></div>';
  if(o.pick)el.querySelectorAll(".fcv-b").forEach(b=>b.onclick=()=>o.pick(b.dataset.d,{name:b.dataset.n,start:+b.dataset.s,end:+b.dataset.e}));
}
function month(el,ym,o){
  const[y,m]=ym.split("-").map(Number),first=new Date(y,m-1,1),t=today(),n=new Date(y,m,0).getDate();
  let h='<div class="fcv-mo"><div class="fcv-dow">'+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>'<span>'+x+'</span>').join("")+'</div><div class="fcv-grid">';
  for(let i=0;i<first.getDay();i++)h+='<span class="fcv-c pad"></span>';
  for(let d=1;d<=n;d++){const ds=y+"-"+pad(m)+"-"+pad(d),c=(o.cell&&o.cell(ds))||{},ok=o.click&&!c.off;
    h+='<button type="button" class="fcv-c'+(ds===t?" t":"")+(c.cls?" "+c.cls:"")+'" data-d="'+ds+'"'+(ok?"":" disabled")+'><span class="n">'+d+'</span>'+(c.html||"")+'</button>'}
  el.innerHTML=h+'</div></div>';
  if(o.click)el.querySelectorAll(".fcv-c[data-d]:not([disabled])").forEach(b=>b.onclick=()=>o.click(b.dataset.d));
}
function nav(el,label,prev,next){el.innerHTML='<button type="button" class="fcv-nb" aria-label="Previous"'+(prev?"":" disabled")+'>&lsaquo;</button><span>'+label+'</span><button type="button" class="fcv-nb" aria-label="Next"'+(next?"":" disabled")+'>&rsaquo;</button>';
  const b=el.querySelectorAll("button");if(prev)b[0].onclick=prev;if(next)b[1].onclick=next}
return {pad,ymd,parse,add,today,monday,addMonth,ft,kind,esc,dl,week,month,nav};
})();

const VKEY="fc_view_"+STORE_ID, SB=STATIC_STATE.shifts_by_date, ALLD=Object.keys(SB).sort();
let VIEW=localStorage.getItem(VKEY)||"day", WK=null, MO=null;
const qv=new URLSearchParams(location.search).get("view"); if(["day","week","month"].includes(qv)) VIEW=qv;
function _q(){return (document.getElementById("search").value||"").toLowerCase().trim()}
function _f(s){const q=_q();return !q||(s.name||"").toLowerCase().includes(q)}
function renderAll(){
  try{document.getElementById("updated").textContent=new Date(STATIC_STATE.last_updated).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch(e){}
  document.querySelectorAll("#fcvTabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===VIEW));
  const days=document.getElementById("days"), alt=document.getElementById("fcvAlt");
  if(VIEW==="day"||!ALLD.length){days.style.display="";alt.style.display="none";render();return}
  days.style.display="none";alt.style.display="";
  const t=FCV.today(), minD=ALLD[0], maxD=ALLD[ALLD.length-1], clamp=d=>d<minD?minD:d>maxD?maxD:d, navEl=document.getElementById("fcvNav"), body=document.getElementById("fcvBody");
  if(VIEW==="week"){
    if(!WK) WK=FCV.monday(clamp(t));
    FCV.nav(navEl,"Week of "+FCV.dl(WK,{month:"short",day:"numeric"}),WK>minD?()=>{WK=FCV.add(WK,-7);renderAll()}:null,FCV.add(WK,6)<maxD?()=>{WK=FCV.add(WK,7);renderAll()}:null);
    FCV.week(body,SB,{start:WK,filter:_f,empty:_q()?"No shifts for that name this week":"No shifts this week"});
    document.getElementById("fcvHint").textContent="Swipe sideways to see the whole week.";
  } else {
    if(!MO) MO=clamp(t).slice(0,7);
    FCV.nav(navEl,FCV.dl(MO+"-01",{month:"long",year:"numeric"}),MO>minD.slice(0,7)?()=>{MO=FCV.addMonth(MO,-1);renderAll()}:null,MO<maxD.slice(0,7)?()=>{MO=FCV.addMonth(MO,1);renderAll()}:null);
    const q=_q();
    FCV.month(body,MO,{cell:ds=>{
        const all=SB[ds]; if(!all) return {cls:"dim",off:true};
        const ss=all.filter(s=>s.kind!=="OUT"&&_f(s)), past=ds<t;
        if(q) return {html:ss.map(s=>'<small>'+FCV.ft(s.start)+'-'+FCV.ft(s.end)+'</small>').join(""),cls:(ss.length?"has":"")+(past?" dim":""),off:past};
        const open=ss.filter(s=>(s.name||"").toUpperCase()==="OPEN").length, n=ss.length-open;
        return {html:(n?'<small>'+n+' on</small>':'')+(open?'<small class="o">'+open+' open</small>':''),cls:(n?"has":"")+(past?" dim":""),off:past}},
      click:ds=>{VIEW="day";localStorage.setItem(VKEY,VIEW);renderAll();setTimeout(()=>{const el=document.querySelector('.fc-day[data-d="'+ds+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"})},120)}});
    document.getElementById("fcvHint").textContent=q?"Showing shifts for \""+q+"\". Tap a day to see everyone.":"Tip: type your name above to see just your shifts. Tap a day for details.";
  }
}
document.querySelectorAll("#fcvTabs button").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;localStorage.setItem(VKEY,VIEW);renderAll();window.scrollTo(0,0)});
document.getElementById("search").addEventListener("input", renderAll);
document.getElementById("search").value = localStorage.getItem(SEARCH_KEY) || "";
try { document.getElementById("cowork-updated-stamp").textContent = "Updated: " + new Date(STATIC_STATE.last_updated).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); } catch(e){}
async function _checkFresh(){try{const r=await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"});const t=await r.text();const m=t.match(/"last_updated":"([^"]+)"/);if(m&&m[1]!==STATIC_STATE.last_updated){location.reload();}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden)_checkFresh();});
renderAll();
</script>
</body></html>
